<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multibank</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <section class="main-navigation">
        <div class="navigation">
          <div class="upper-navigation">
            <div class="logo-img">
              <img
                src="images/illustration/main-logo.svg"
                alt="Multibank Logo"
              />
            </div>
            <div class="menu-search-icon">
              <div class="search-icon">
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
              </div>
              <div class="menu-icon">
                <i class="fa-solid fa-bars"></i>
                <nav class="menu">
                  <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Service</a></li>
                    <li><a href="#">Contact</a></li>
                  </ul>
                </nav>
              </div>
            </div>
          </div>

          <div class="lower-navigation">
            <div class="online-banking">
              <i class="fa-solid fa-arrow-right-to-bracket"></i>
              <a href="#"> Online Banking</a>
            </div>
          </div>
        </div>
      </section>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <div class="main-img">
            <img
              src="images/illustration/hero-img.jpg"
              alt="Banking Hero Image"
            />
          </div>

          <div class="hero-content">
            <p>Welcome to Multibank</p>

            <div class="text-content">
              <h1>The future of banking is already here</h1>
              <p class="description">
                $0 Monthly Service Charge. Low minimum deposit to open.
              </p>
            </div>

            <a href="#" class="learn-btn">
              <span>Learn More</span>
            </a>
          </div>
        </div>
      </section>

      <section class="servies">
        
      </section>
    </main>
  </body>
</html>
